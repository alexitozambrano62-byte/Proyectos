<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Web Única (One Page)</title>
    <style>
        html {scroll-behavior: smooth;} /*Desplazamiento suave*/
        nav {position: fixed; top: 0; width: 100%; background-color: aqua; padding: 10px; text-align: center;}
        nav a {color: beige; margin: 0.15px; text-decoration: none; font-family: sans-serif;}
        section {height: 100vh; padding-top: 80px; box-sizing: border-box; text-align: center;font-family: sans-serif;}
        #inicio {background: #ffe0b2;}
        #servicios {background: #ffe0b2;}
        #contacto {background: #d1c4e9;}
    </style>
</head>
<body>
    <!--Menú de navegación-->
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>
</body>
</html>
